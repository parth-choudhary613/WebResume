<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parth Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/vite.png" />
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <style>
      #global-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color:#110627; /* Match your light theme bg */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.9s ease-out; /* Smooth fade out */
      }
      
      /* Dark mode support (Optional: matches your system preference initially) */
      @media (prefers-color-scheme: dark) {
        #global-loader {
          background-color: #020617; /* Match your slate-950 */
        }
      }
    </style>
  </head>
  <body>
    <div id="global-loader">
      <lottie-player 
        src="/Loading.json" 
        background="transparent" 
        speed="1" 
        style="width: 300px; height: 300px;" 
        loop 
        autoplay>
      </lottie-player>
    </div>

    <div id="root"></div>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
